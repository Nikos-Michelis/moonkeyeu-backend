jwt:
  issuer: 'https://backend.moonkeyeu.com'
  audience: 'https://www.moonkeyeu.com'
  public:
    access:
      key: ./jwt-keys/access-token/access-token-public.pem
    refresh:
      key: ./jwt-keys/refresh-token/refresh-token-public.pem
  private:
    access:
      key: ./jwt-keys/access-token/access-token-private.pem
    refresh:
      key: ./jwt-keys/refresh-token/refresh-token-private.pem
spring:
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
    encoding: UTF-8

  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:${LOCAL_MYSQL_PORT}}/${MYSQL_DATABASE:${LOCAL_MYSQL_DATABASE}}
    username: ${MYSQL_USER:${LOCAL_MYSQL_USER}}
    password: ${MYSQL_PASSWORD:${LOCAL_MYSQL_PASSWORD}}
    driver-class-name: com.mysql.cj.jdbc.Driver

  batch:
    jdbc:
      table-prefix: BATCH_
      initialize-schema: always

  jpa:
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 50
      jdbc:
        batch_size: 50
        time_zone: UTC
    database: mysql
    database-platform: org.hibernate.dialect.MySQL8Dialect

  docker:
    compose:
      enabled: false

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            client-name: Google

  mail:
    sender: test@test.com
    host: localhost
    port: 3025
    username: test
    password: test
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
            required: false

application:
  name: MoonkeyEU
  frontend:
    url: http://localhost:3001
  backend:
    url: http://localhost:8080/api/v1/
  limiter:
    threshold: 300000
    scheduled-time: 300000
  otp:
    max-resend-attempts: 3
    max-validation-attempts: 3
    cooldown-seconds: 60
    expiration: 300
    length: 6
  api:
    nasa-apod:
      url: https://api.nasa.gov/planetary/apod
      key: ${NASA_APOD_KEY}
      media:
        type: 'image'
management:
  endpoints:
    web:
      exposure:
        include: [ "health", "prometheus", "metrics" ]
  endpoint:
    health:
      show-details: always
      group:
        core-api:
          include: db, mail
  health:
    mail:
      enabled: true
    db:
      enabled: true
    diskspace:
      enabled: false
  prometheus:
    metrics:
      export:
        enabled: true

server:
  port: 8081
  servlet:
    context-path: /api/v1/
  cors:
    origins: http://localhost:3001

logging:
  level:
    security:
      web: TRACE
    org:
      springframework:
        jdbc:
          datasource:
            DriverManagerDataSource: DEBUG
      hibernate:
        SQL: off
        type:
          descriptor:
            sql:
              BasicBinder: TRACE