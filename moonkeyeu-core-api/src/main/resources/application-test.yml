jwt:
  issuer: 'https://backend.moonkeyeu.com'
  audience: 'https://www.moonkeyeu.com'
  public:
    access:
      key: classpath:jwt-keys/access-token/access-token-public.pem
    refresh:
      key: classpath:jwt-keys/refresh-token/refresh-token-public.pem
  private:
    access:
      key: classpath:jwt-keys/access-token/access-token-private.pem
    refresh:
      key: classpath:jwt-keys/refresh-token/refresh-token-private.pem
spring:
  sql:
    init:
      mode: always
      data-locations: classpath:test_db/*.sql

  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: none

  mail:
    host: localhost
    port: 3025
    username: test@test.com
    password: test
    sender: test@test.com
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
            required: false

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: "test-id"
            client-secret: "test-secret"
            client-name: Google

application:
  frontend:
    url: http://localhost:3001
  backend:
    url: http://localhost:8080/api/v1/
  limiter:
    threshold: 300000
    scheduled-time: 300000
  otp:
    max-resend-attempts: 3
    max-validation-attempts: 3
    cooldown-seconds: 60
    expiration: 300
    length: 6
  api:
    nasa-apod:
      url: https://api.nasa.gov/planetary/apod
      key: ${NASA_APOD_KEY}
      media:
        type: 'image'

server:
  port: 8081
  servlet:
    context-path: /api/v1/
  cors:
    origins: http://localhost:3001

logging:
  level:
    security:
      web: TRACE
    org:
      springframework:
        jdbc:
          datasource:
            DriverManagerDataSource: DEBUG
        test:
          context: DEBUG
        boot:
          testcontainers: DEBUG
      hibernate:
        SQL: off
        type:
          descriptor:
            sql:
              BasicBinder: TRACE