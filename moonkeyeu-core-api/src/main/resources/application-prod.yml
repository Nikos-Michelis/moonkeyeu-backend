jwt:
  issuer: ${BACKEND_URL}
  audience: ${DOMAIN_URL}
  public:
    access:
      key: ./jwt-keys/access-token/access-token-public.pem
    refresh:
      key: ./jwt-keys/refresh-token/refresh-token-public.pem
  private:
    access:
      key: ./jwt-keys/access-token/access-token-private.pem
    refresh:
      key: ./jwt-keys/refresh-token/refresh-token-private.pem
spring:
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
    encoding: UTF-8

  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT}/${MYSQL_DATABASE}
    username: ${MYSQL_APP_USER}
    password: ${MYSQL_APP_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    clean-disabled: false
    enabled: true
    user: ${MYSQL_MIGRATION_USER}
    password: ${MYSQL_MIGRATION_PASSWORD}
    locations:
      - classpath:db/migration/schema
      - classpath:db/migration/seed
    baseline-version: 1

  jpa:
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 50
      jdbc:
        batch_size: 50
        time_zone: UTC
    database: mysql
    database-platform: org.hibernate.dialect.MySQL8Dialect

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            client-name: Google

  mail:
    sender: ${MAIL_SENDER}
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

application:
  seo:
    name: MoonkeyEU
    logo: ${CLOUDFRONT_URL}/media/assets/moonkeyeu-logo.jpg
    description: Stay up to date with upcoming and past spaceflight from NASA, SpaceX, and other leading space agencies around the world.
  frontend:
    url: ${DOMAIN_URL:http://localhost:3001}
  backend:
    url: ${BACKEND_URL:http://localhost:8080}/api/v1/
  limiter:
    threshold: 300000
    scheduled-time: 300000
  otp:
    max-resend-attempts: 3
    max-validation-attempts: 3
    cooldown-seconds: 60
    expiration: 300
    length: 6
  api:
    nasa-apod:
      url: https://api.nasa.gov/planetary/apod
      key: ${NASA_APOD_KEY}
      media:
        type: 'image'
management:
  endpoints:
    web:
      exposure:
        include: [ "health", "prometheus", "metrics" ]
  endpoint:
    health:
      show-details: always
      group:
        core-api:
          include: db
  health:
    mail:
      enabled: false
    db:
      enabled: true
    diskspace:
      enabled: false
  prometheus:
    metrics:
      export:
        enabled: true

server:
  port: ${API_CORE_PORT:8080}
  servlet:
    context-path: /api/v1/
  cors:
    origins: https://www.moonkeyeu.com, https://moonkeyeu.com


logging:
  level:
    security:
      web: DEBUG
    org:
      springframework:
        jdbc:
          datasource:
            DriverManagerDataSource: DEBUG
      hibernate:
        SQL: off
        type:
          descriptor:
            sql:
              BasicBinder: off