name: Test
on:
  workflow_call:
    inputs:
      module_name:
        required: true
        type: string
    secrets:
      NASA_APOD_KEY:
        required: true
      S3_REGION:
        required: true
      S3_BUCKET:
        required: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    name: Running Unit Tests
    steps:
      - name: Checkout
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98 #v6.0.2

      - name: Download SQL artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #v8.0.1
        with:
          name: migration
          path: ./${{ inputs.module_name }}/src/main/resources/db/migration/

      - name: Setup JDK
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 #v5.0.0
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Cache Maven dependencies
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 #v5.0.4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Make mvnw executable
        run: cd ${{ inputs.module_name }} && chmod +x ./mvnw

      - name: Running Unit Tests
        run: cd ${{ inputs.module_name }} && ./mvnw -B verify -Punit-test
        env:
          API_PROFILE: ${{ vars.API_PROFILE }}

      - name: Upload coverage data
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f #v7.0.0
        with:
          name: jacoco-exec-unit-${{ inputs.module_name }}
          path: ${{ inputs.module_name }}/target/jacoco/*.exec
          if-no-files-found: error

      - name: Upload tests results
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f #v7.0.0
        with:
          name: test-results-unit-${{ inputs.module_name }}
          path: ${{ inputs.module_name }}/target/site/jacoco/
          if-no-files-found: error

      - name: Unit tests coverage
        uses: madrapps/jacoco-report@e51ce1f46f7f8b5331593f935e59cbaf44b84920 #v1.8.0
        with:
          paths: ${{ inputs.module_name }}/target/site/jacoco/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          title: Unit tests coverage `${{ inputs.module_name }}`
          update-comment: true
          comment-type: both
          min-coverage-overall: 50

  integration-tests:
    runs-on: ubuntu-latest
    needs: [ unit-tests ]
    name: Running Integration Tests
    steps:
      - name: Checkout
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98 #v6.0.2

      - name: Download SQL artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #v8.0.1
        with:
          name: migration
          path: ./${{ inputs.module_name }}/src/main/resources/db/migration/

      - name: Setup JDK
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 #v5.0.0
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Cache Maven dependencies
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 #v5.0.4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Make mvnw executable
        run: cd ${{ inputs.module_name }} && chmod +x ./mvnw

      - name: Running Integration Tests
        run: cd ${{ inputs.module_name }} && ./mvnw -B verify -Pintegration-test
        env:
          API_PROFILE: ${{ vars.API_PROFILE }}
          CLOUDFRONT_URL: ${{ vars.CLOUDFRONT_URL }}
          NASA_APOD_KEY: ${{ secrets.NASA_APOD_KEY }}
          S3_REGION: ${{ secrets.S3_REGION }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_BUCKET_ROOT: ${{ vars.S3_BUCKET_ROOT }}
          THE_SPACE_DEVS_CDN: ${{ vars.THE_SPACE_DEVS_CDN }}

      - name: Upload coverage data
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f #v7.0.0
        with:
          name: jacoco-exec-it-${{ inputs.module_name }}
          path: ${{ inputs.module_name }}/target/jacoco/*.exec
          if-no-files-found: error

      - name: Upload tests results
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f #v7.0.0
        with:
          name: test-results-it-${{ inputs.module_name }}
          path: ${{ inputs.module_name }}/target/site/jacoco/
          if-no-files-found: error

      - name: Integration tests coverage
        uses: madrapps/jacoco-report@e51ce1f46f7f8b5331593f935e59cbaf44b84920 #v1.8.0
        with:
          paths: ${{ inputs.module_name }}/target/site/jacoco/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          title: Integration tests coverage `${{ inputs.module_name }}`
          update-comment: true
          comment-type: both
          min-coverage-overall: 50