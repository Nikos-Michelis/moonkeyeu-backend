name: Build and push Docker image
on:
  workflow_call:
    inputs:
      module_name:
        required: true
        type: string
    secrets:
      NASA_APOD_KEY:
        required: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    name: Running Unit Tests
    steps:
      - name: Checkout
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98 #v6.0.2

      - name: Setup JDK
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 #v5.0.0
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Cache Maven dependencies
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 #v5.0.4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Make mvnw executable
        run: cd ${{ inputs.module_name }} && chmod +x ./mvnw

      - name: Running Unit Tests
        if: ${{ inputs.module_name != 'moonkeyeu-etl-api' }}
        run: cd ${{ inputs.module_name }} && ./mvnw verify test -Punit-test
        env:
          API_PROFILE: ${{ vars.API_PROFILE }}

      - name: Skip Unit Test
        if: ${{ inputs.module_name == 'moonkeyeu-etl-api' }}
        run: |
          echo "Tests Skipped" >> $GITHUB_STEP_SUMMARY
          echo "Module '${{ inputs.module_name }}' is excluded from unit tests. Marking as complete." >> $GITHUB_STEP_SUMMARY
          echo "Skipping tests for ${{ inputs.module_name }}, but passing the job."

  integration-tests:
    runs-on: ubuntu-latest
    needs: [ unit-tests ]
    name: Running Integration Tests
    steps:
      - name: Checkout
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98 #v6.0.2

      - name: Download SQL artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #v8.0.1
        with:
          name: test-db
          path: ./${{ inputs.module_name }}/src/main/resources/

      - name: Setup JDK
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Cache Maven dependencies
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 #v5.0.4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Make mvnw executable
        run: cd ${{ inputs.module_name }} && chmod +x ./mvnw

      - name: Running Integration Tests
        if: inputs.module_name != 'moonkeyeu-etl-api'
        run: cd ${{ inputs.module_name }} && ./mvnw verify test -Pintegration-test
        env:
          API_PROFILE: ${{ vars.API_PROFILE }}
          CLOUDFRONT_URL: ${{ vars.CLOUDFRONT_URL }}
          NASA_APOD_KEY: ${{ secrets.NASA_APOD_KEY }}

      - name: Skip Integration Test
        if: ${{ inputs.module_name == 'moonkeyeu-etl-api' }}
        run: |
          echo "Tests Skipped" >> $GITHUB_STEP_SUMMARY
          echo "Module '${{ inputs.module_name }}' is excluded from integration tests. Marking as complete." >> $GITHUB_STEP_SUMMARY
          echo "Skipping tests for ${{ inputs.module_name }}, but passing the job."