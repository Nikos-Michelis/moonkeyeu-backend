name: Deploy backend to LightSail VPS

on:
  workflow_call:
    secrets:
      VPS_HOST:
        required: true
      VPS_USERNAME:
        required: true
      VPS_SSH_KEY:
        required: true
      VPS_PORT:
        required: true
      S3_REGION:
        required: true

env:
  APP_NAME: ${{ vars.APP_NAME }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod

    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USERNAME }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      AWS_DEFAULT_REGION: ${{ secrets.S3_REGION }}
      APP_NAME: ${{ vars.APP_NAME }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Ansible
        run: |
          sudo apt update
          sudo apt install -y ansible

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key

      - name: Run Ansible
        run: |
          ansible-playbook \
            -i ansible/inventory.ini \
            ansible/playbook/deploy.yml \
            --private-key ~/.ssh/vps_key