name: Deploy to LightSail VPS

on:
  workflow_call:
    inputs:
      image_tag:
        required: true
        type: string
    secrets:
      VPS_HOST:
        required: true
      VPS_SSH_KEY:
        required: true
      VPS_PORT:
        required: true
      ANSIBLE_VAULT_PASSWORD:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Checkout repository
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98 #v6.0.2

      - name: Create vault password file
        env:
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          printf '%s' "$ANSIBLE_VAULT_PASSWORD" | tr -d '\r' > /tmp/vault_pass.txt
          echo "vault password file: $(wc -c < /tmp/vault_pass.txt) bytes (expected 2774)"

      - name: Install Ansible
        shell: bash
        run: |
          sudo apt update
          sudo apt install -y ansible

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Rollout
        working-directory: ansible
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          ansible-playbook \
            -i inventories/production/hosts.yml \
            --vault-password-file /tmp/vault_pass.txt \
            playbooks/deploy.yml \
            --private-key ~/.ssh/vps_key \
            -e "image_tag=$IMAGE_TAG"

      - name: Clean up secrets
        if: always()
        run: rm -f /tmp/vault_pass.txt ~/.ssh/vps_key