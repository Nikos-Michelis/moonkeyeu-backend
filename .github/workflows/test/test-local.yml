name: Local Test Runner
on: [push]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    name: Running Unit Tests
    strategy:
      matrix:
        module: [ moonkeyeu-core-api, moonkeyeu-etl-api ]
    steps:
      - name: Checkout
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98 #v6.0.2

      - name: Setup JDK
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 #v5.0.0
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Cache Maven dependencies
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 #v5.0.4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Make mvnw executable
        run: cd ${{ matrix.module }} && chmod +x ./mvnw

      - name: Running Unit Tests
        if: ${{ matrix.module != 'moonkeyeu-etl-api' }}
        run: cd ${{ matrix.module }} && ./mvnw verify test -Punit-test
        env:
          API_PROFILE: test

      - name: Skip Unit Test
        if: ${{ matrix.module == 'moonkeyeu-etl-api' }}
        run: |
          echo "Tests Skipped" >> $GITHUB_STEP_SUMMARY
          echo "Module '${{ matrix.module }}' is excluded from unit tests. Marking as complete." >> $GITHUB_STEP_SUMMARY
          echo "Skipping tests for ${{ matrix.module }}, but passing the job."

  integration-tests:
    runs-on: ubuntu-latest
    needs: [ unit-tests ]
    name: Running Integration Tests
    strategy:
      matrix:
        module: [ moonkeyeu-core-api, moonkeyeu-etl-api ]
    steps:
      - name: Checkout
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98 #v6.0.2

      - name: Download SQL artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #v8.0.1
        with:
          name: test-db
          path: ./${{ matrix.module }}/src/main/resources/

      - name: Setup JDK
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Cache Maven dependencies
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 #v5.0.4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Make mvnw executable
        run: cd ${{ matrix.module }} && chmod +x ./mvnw

      - name: Running Integration Tests
        if: matrix.module != 'moonkeyeu-etl-api'
        run: cd ${{ matrix.module }} && ./mvnw verify test -Pintegration-test
        env:
          API_PROFILE: test
          CLOUDFRONT_URL: https://cdn.example.com/
          NASA_APOD_KEY: nasa_apod_test_key

      - name: Skip Integration Test
        if: ${{ matrix.module == 'moonkeyeu-etl-api' }}
        run: |
          echo "Tests Skipped" >> $GITHUB_STEP_SUMMARY
          echo "Module '${{ matrix.module }}' is excluded from integration tests. Marking as complete." >> $GITHUB_STEP_SUMMARY
          echo "Skipping tests for ${{ matrix.module }}, but passing the job."