spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT}/${MYSQL_DATABASE}
    username: ${MYSQL_MIGRATION_USER}
    password: ${MYSQL_MIGRATION_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  batch:
    jdbc:
      table-prefix: BATCH_
      initialize-schema: always
      platform: mysql
    job:
      enabled: false

  flyway:
    clean-disabled: false
    enabled: false
    user: ${MYSQL_MIGRATION_USER}
    password: ${MYSQL_MIGRATION_PASSWORD}
    locations:
      - filesystem:db/migration/schema
      - filesystem:db/migration/seed
    baseline-version: 1

  main:
    allow-bean-definition-overriding: true
  http:
    codecs:
      max-in-memory-size: 20MB

aws:
  region: ${S3_REGION}
  s3:
    buckets:
      root: ${S3_BUCKET_ROOT}
      bucket-name: ${S3_BUCKET}
  cloudfront:
    url: ${CLOUDFRONT_URL}

application:
  webclient:
    max-retries: 30
    retry-delay-seconds: 60
  backend:
    url: http://localhost:8080/api/v1
  path:
    root:
      data:
        folder:
          json: ${user.home}/${DATA_PATH}/backend/data/json-dataset
          images: ${user.home}/${DATA_PATH}/backend/data/images
  api:
    the-space-devs:
      url: https://ll.thespacedevs.com
      version: ${THE_SPACE_DEVS_VERSION}

management:
  endpoints:
    web:
      exposure:
        include: [ "health", "prometheus", "metrics" ]

  endpoint:
    health:
      show-details: always
      group:
        etl-api:
          include: db
  health:
    db:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true

server:
  port: ${API_ETL_PORT:8081}
  servlet:
    context-path: /api/v1

logging:
  level:
    security:
      web: DEBUG
    org:
      springframework:
        jdbc:
          datasource:
            DriverManagerDataSource: DEBUG
      hibernate:
        SQL: off
        type:
          descriptor:
            sql:
              BasicBinder: off