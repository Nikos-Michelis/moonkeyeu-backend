spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:${LOCAL_MYSQL_PORT}}/${MYSQL_DATABASE:${LOCAL_MYSQL_DATABASE}}
    username: ${MYSQL_USER:${LOCAL_MYSQL_USER}}
    password: ${MYSQL_PASSWORD:${LOCAL_MYSQL_PASSWORD}}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 50
      jdbc:
        batch_size: 50
        time_zone: UTC
    database: mysql
    database-platform: org.hibernate.dialect.MySQL8Dialect

  batch:
    jdbc:
      table-prefix: BATCH_
      initialize-schema: always
      platform: mysql
    job:
      enabled: false

  main:
    allow-bean-definition-overriding: true
  http:
    codecs:
      max-in-memory-size: 20MB

aws:
  region: ${S3_REGION}
  s3:
    buckets:
      db-images: ${S3_BUCKET}
      root: ${S3_BUCKET_ROOT}
  cloudfront:
    url: ${CLOUDFRONT_URL}

application:
  backend:
    url: ${CORE_API_URL}
  path:
    root:
      data:
        folder:
          csv: ${CSV_DATASET}
          json: ${JSON_DATASET}
          images: ${DB_IMAGES_DIR}
  raw:
    root:
      data:
        folder: ${INPUT_RAW_DIR}
  api:
    the-space-devs:
      url: ${THE_SPACE_DEVS_URL}
      version: ${THE_SPACE_DEVS_VERSION}

management:
  endpoints:
    web:
      exposure:
        include: [ "health", "prometheus", "metrics" ]
  endpoint:
    health:
      show-details: always
      group:
        core-api:
          include: db
  health:
    db:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true

server:
  port: ${ETL_API_PORT}
  servlet:
    context-path: ${API_CONTEXT_PATH}

logging:
  level:
    security:
      web: DEBUG
    org:
      springframework:
        jdbc:
          datasource:
            DriverManagerDataSource: DEBUG
      hibernate:
        SQL: off
        type:
          descriptor:
            sql:
              BasicBinder: off

