version: '3.8'
services:
  mysqldb:
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: "750m"
    image: mysql:8.0.30
    container_name: mysql-container
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_APP_USER}
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD}
    volumes:
      - mysql-db-data:/var/lib/mysql:rw
      - ./db/init:/docker-entrypoint-initdb.d:ro
    restart: always
    networks:
      - private-internal-network
    healthcheck:
      test: mysql --user=${MYSQL_APP_USER} --password=${MYSQL_APP_PASSWORD} --execute="SHOW DATABASES;"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  moonkeyeu-core-api:
    build: ./moonkeyeu-core-api
    deploy:
      resources:
        limits:
          cpus: "1.3"
          memory: "900m"
    container_name: moonkeyeu-core-api-container
    restart: on-failure
    environment:
      MYSQL_HOST: mysqldb
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_PORT: ${MYSQL_PORT}
      MYSQL_APP_USER: ${MYSQL_APP_USER}
      MYSQL_APP_PASSWORD: ${MYSQL_APP_PASSWORD}
      MYSQL_MIGRATION_USER: ${MYSQL_MIGRATION_USER}
      MYSQL_MIGRATION_PASSWORD: ${MYSQL_MIGRATION_PASSWORD}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_SENDER: ${MAIL_SENDER}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      NASA_APOD_KEY: ${NASA_APOD_KEY}
      API_CORE_PORT: ${API_CORE_PORT}
      API_PROFILE: ${API_PROFILE}
      APP_NAME: ${APP_NAME}
      DOMAIN_URL: ${DOMAIN_URL}
      BACKEND_URL: ${BACKEND_URL}
      CLOUDFRONT_URL: ${CLOUDFRONT_URL}
    volumes:
      - ./jwt-keys:/app/jwt-keys:ro
    depends_on:
      mysqldb:
        condition: service_healthy
    networks:
      - private-internal-network
    healthcheck:
      test: [ "CMD-SHELL", "curl -s http://localhost:8080/api/v1/actuator/health | jq -e '.status == \"UP\"' || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  moonkeyeu-etl-api:
    build: ./moonkeyeu-etl-api
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: "500m"
    container_name: moonkeyeu-etl-api-container
    restart: on-failure
    environment:
      MYSQL_HOST: mysqldb
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_PORT: ${MYSQL_PORT}
      MYSQL_APP_USER: ${MYSQL_APP_USER}
      MYSQL_APP_PASSWORD: ${MYSQL_APP_PASSWORD}
      AWS_ACCOUNT_ID: ${AWS_ACCOUNT_ID}
      S3_REGION: ${S3_REGION}
      S3_BUCKET: ${S3_BUCKET}
      S3_BUCKET_ROOT: ${S3_BUCKET_ROOT}
      CLOUDFRONT_URL: ${CLOUDFRONT_URL}
      THE_SPACE_DEVS_VERSION: ${THE_SPACE_DEVS_VERSION}
      API_ETL_PORT: ${API_ETL_PORT}
      API_PROFILE: prod
      APP_NAME: ${APP_NAME}
      CSV_DATASET: /app/data/csv-dataset
      JSON_DATASET: /app/data/json-dataset
      DB_IMAGES_DIR: /app/data/images
    volumes:
      - ./data/json-dataset:/app/data/json-dataset:rw
      - /home/moonkeyeu/.aws:/root/.aws:ro
      #- ~/.aws:/root/.aws
    depends_on:
      mysqldb:
        condition: service_healthy
      moonkeyeu-core-api:
        condition: service_healthy
    ports:
      - "8081:8081"
    networks:
      - private-internal-network
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8081/api/v1/actuator/health | jq -e '.status == \"UP\"' || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  prometheus:
    image: docker.io/prom/prometheus:v3.10.0
    container_name: prometheus-container
    ports:
      - "9090:9090"
    command:
      - --web.enable-remote-write-receiver
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    deploy:
      resources:
        limits:
          cpus: "0.6"
          memory: "160m"
    networks:
      - private-internal-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  alloy:
    image: docker.io/grafana/alloy:v1.14.0
    container_name: alloy-container
    environment:
      MYSQL_ALLOY: ${MYSQL_MONITORING_USER}
      MYSQL_ALLOY_PASSWORD: ${MYSQL_MONITORING_PASSWORD}
    deploy:
      resources:
        limits:
          cpus: "0.6"
          memory: "200m"
    depends_on:
      prometheus:
        condition: service_healthy
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy
    volumes:
      - alloy_data:/var/lib/alloy/data:rw
      - ./monitoring/alloy:/etc/alloy:ro
      - ./nginx/logs:/var/log/myapp:ro
    ports:
      - "12345:12345"
    networks:
      - private-internal-network
    restart: unless-stopped

  loki:
    image: docker.io/grafana/loki:3.6.7
    container_name: loki-container
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - data_loki:/loki/loki-data/:rw
      - ./monitoring/loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
    ports:
      - "3100:3100"
    depends_on:
      alloy:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "0.6"
          memory: "160m"
    networks:
      - private-internal-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "/usr/bin/loki", "-health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  grafana:
    image: docker.io/grafana/grafana-oss:12.4.0
    container_name: grafana-container
    environment:
      - GF_SERVER_ROOT_URL=${GF_SERVER_ROOT_URL}
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
      alloy:
        condition: service_started
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/json:/var/lib/grafana/dashboards:ro
    deploy:
      resources:
        limits:
          cpus: "0.6"
          memory: "160m"
    networks:
      - private-internal-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://grafana-container:3000/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nginx:
    build: ./nginx
    container_name: nginx-container
    environment:
      NGINX_PORT: ${NGINX_PORT}
      NGINX_HTTPS_PORT: ${NGINX_HTTPS_PORT}
      NGINX_SERVER_NAME: ${NGINX_SERVER_NAME}
    depends_on:
      grafana:
        condition: service_healthy
    volumes:
      - ./nginx/conf/nginx.conf:/etc/nginx/templates/nginx.conf.template
      - ./nginx/logs:/var/log/myapp:rw
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./nginx/certbot/www:/var/www/certbot
    ports:
      - "83:83"
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: "256m"
    restart: unless-stopped
    networks:
      - private-internal-network
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:83/health | jq -e '.status == \"UP\"' || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  certbot:
    image: certbot/certbot
    container_name: certbot-container
    depends_on:
      nginx:
        condition: service_healthy
    volumes:
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./nginx/certbot/www:/var/www/certbot
    deploy:
      resources:
        limits:
          cpus: "0.6"
          memory: "100m"
    #command: certonly --webroot -w /var/www/certbot --keep-until-expiring --email ${CERTBOT_EMAIL} -d ${CERTBOT_DOMAIN_BACKEND} --agree-tos
    #command: renew --dry-run
    #command: renew --force-renewal
    command: renew

networks:
  private-internal-network:
    driver: bridge
volumes:
  mysql-db-data:
    name: mysql-db-data
  data_loki:
    name: data_loki
    driver: local
  alloy_data:
    name: alloy_data
    driver: local
