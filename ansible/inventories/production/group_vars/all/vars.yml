compose_env:
  APP_NAME: moonkeyeu
  API_PROFILE: prod
  API_CORE_PORT: 8080
  API_ETL_PORT: 8081

  DOMAIN_URL: https://www.moonkeyeu.com
  BACKEND_URL: https://backend.moonkeyeu.com
  CLOUDFRONT_URL: https://cdn.moonkeyeu.com

  DATA_PATH: /Desktop/Projects/MoonkeyEU/MoonkeyEU-Github
  JSON_DATASET: /app/data/json-dataset
  DB_IMAGES_DIR: /app/data/images

  MYSQL_ROOT: "{{ vault_mysql_root }}"
  MYSQL_ROOT_PASSWORD: "{{ vault_mysql_root_password }}"
  MYSQL_APP_USER: "{{ vault_mysql_app_user }}"
  MYSQL_APP_PASSWORD: "{{ vault_mysql_app_password }}"
  MYSQL_MONITORING_USER: "{{ vault_mysql_monitoring_user }}"
  MYSQL_MONITORING_PASSWORD: "{{ vault_mysql_monitoring_password }}"
  MYSQL_MIGRATION_USER: "{{ vault_mysql_migration_user }}"
  MYSQL_MIGRATION_PASSWORD: "{{ vault_mysql_migration_password }}"
  MYSQL_DATABASE: "{{ vault_mysql_database }}"
  MYSQL_PORT: "{{ vault_mysql_port }}"

  CERTBOT_EMAIL: "{{ vault_certbot_email }}"
  CERTBOT_DOMAIN_BACKEND: "{{ vault_certbot_domain_backend }}"

  GF_SERVER_ROOT_URL: "{{ vault_gf_server_root_url }}"
  GF_SECURITY_ADMIN: "{{ vault_gf_security_admin }}"
  GF_SECURITY_ADMIN_PASSWORD: "{{ vault_gf_security_admin_password }}"

  S3_REGION: "{{ vault_s3_region }}"
  S3_BUCKET: "{{ vault_s3_bucket }}"
  S3_BUCKET_ROOT: "{{ vault_s3_bucket_root }}"

  MAIL_HOST: "{{ vault_mail_host }}"
  MAIL_PORT: "{{ vault_mail_port }}"
  MAIL_USERNAME: "{{ vault_mail_username }}"
  MAIL_PASSWORD: "{{ vault_mail_password }}"
  MAIL_SENDER: "{{ vault_mail_sender }}"

  GOOGLE_CLIENT_ID: "{{ vault_google_client_id }}"
  GOOGLE_CLIENT_SECRET: "{{ vault_google_client_secret }}"

  NASA_APOD_KEY: "{{ vault_nasa_apod_key }}"
  THE_SPACE_DEVS_VERSION: "{{ vault_the_space_devs_version }}"
  THE_SPACE_DEVS_CDN: https://thespacedevs-prod.nyc3.digitaloceanspaces.com/media/images/

  AWS_ROLE_ARN: "{{ vault_aws_role_arn }}"
  AWS_ACCESS_KEY_ID: "{{ vault_aws_access_key_id }}"
  AWS_SECRET_ACCESS_KEY: "{{ vault_aws_secret_access_key }}"
  AWS_ACCOUNT_ID: "{{ vault_aws_account_id }}"
  AWS_REGION: "{{ vault_aws_region }}"

  NGINX_PORT: "{{ vault_nginx_port }}"
  NGINX_HTTPS_PORT: "{{ vault_nginx_https_port }}"
  NGINX_SERVER_NAME: "{{ vault_certbot_domain_backend }}"

  VPS_HOST: "{{ vault_vps_host }}"
  VPS_PORT: "{{ vault_vps_port }}"
  VPS_PROVISION_USER: "{{ vault_vps_prov_user }}"
  VPS_ENVIRONMENT_USER: "{{ vault_vps_env_user }}"
