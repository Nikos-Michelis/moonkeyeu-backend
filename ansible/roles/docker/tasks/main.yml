---
- name: Ensure dependencies are installed
  ansible.builtin.package:
    name:
      - bc
      - curl
      - expect
      - git
      - ca-certificates
    state: present

- name: Create Docker GPG key directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Download Docker's official GPG key
  ansible.builtin.get_url:
    url: "{{ docker_apt_base_url }}/gpg"
    dest: "{{ docker_apt_key_path }}"
    mode: "0644"

- name: Detect dpkg architecture
  ansible.builtin.command: dpkg --print-architecture
  register: docker_dpkg_arch
  changed_when: false

- name: Add Docker repository to Apt sources
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ docker_dpkg_arch.stdout }} signed-by={{ docker_apt_key_path }}] {{ docker_apt_base_url }} {{ ansible_distribution_release }} stable"
    state: present
    filename: docker

- name: Update apt cache after adding Docker repository
  ansible.builtin.apt:
    update_cache: true

- name: Install Docker and Docker Compose
  ansible.builtin.package:
    name: "{{ docker_packages }}"
    state: present

- name: Ensure Docker service is enabled and started
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Add users to docker group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop:
    - "{{ prov_user }}"
    - "{{ env_user }}"

- name: Verify deploy user can reach the Docker daemon
  ansible.builtin.command: docker ps
  become: true
  become_user: "{{ env_user }}"
  changed_when: false
