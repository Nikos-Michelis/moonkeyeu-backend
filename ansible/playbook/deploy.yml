- name: Playbook Deploy Application
  hosts: lightsail
  become: false

  vars:
    app_name: "{{ lookup('env', 'APP_NAME') }}"
    src: "project/{{ app_name }}"
    data: "{{ src }}/data"
    keys: "{{ src }}/jwt-keys"
    migration: "{{ src }}/db/migration"
    compose_file: docker-compose.prod.yml
    s3_bucket: "{{ lookup('env', 'S3_BUCKET') }}"
    s3_region: "{{ lookup('env', 'S3_REGION') }}"
    s3_prefix: "database/mysql/migrations/"

  tasks:
    - name: Ensure app directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0750"
      loop:
        - "{{ src }}"
        - "{{ migration }}"
        - "{{ data }}/missions"
        - "{{ data }}/agencies"
        - "{{ keys }}/access-token"
        - "{{ keys }}/refresh-token"

    - name: List migration objects in S3
      amazon.aws.s3_object_info:
        bucket_name: "{{ s3_bucket }}"
        region: "{{ s3_region }}"
        prefix: "{{ s3_prefix }}"
      register: migration_keys

    - name: Download migrations from S3
      ansible.builtin.command:
        argv:
          - aws
          - s3
          - sync
          - "s3://{{ s3_bucket }}/{{ s3_prefix }}"
          - "{{ migration }}/"
          - "--region={{ s3_region }}"
          - --delete
      register: s3_sync
      changed_when: "'download:' in s3_sync.stdout"

    - name: Copy deployment files to server
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../{{ item }}"
        dest: "{{ src }}/"
        mode: "0640"
        directory_mode: "0750"
      loop:
        - "{{ compose_file }}"
        - nginx
        - monitoring

    - name: Pull latest Docker images
      community.docker.docker_compose_v2:
        project_src: "{{ src }}"
        files:
          - docker-compose.prod.yml
        env_files:
          - ".env"
        pull: always
        state: present

    - name: Start containers
      community.docker.docker_compose_v2:
        project_src: "{{ src }}"
        files:
          - "{{ compose_file }}"
        env_files:
          - ".env"
        state: present
        pull: never

    - name: Remove unused Docker images
      community.docker.docker_prune:
        images: true